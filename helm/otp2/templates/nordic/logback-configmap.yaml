{{- if .Values.nordicJourneyPlanner.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otp2nordic-logback-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.nordic.labels" . | indent 4 }}
  annotations:
    {{- include "common.nordic.annotations" . | indent 4 }}
data:
  logback.xml: |-{{ range .Files.Lines .Values.configMap.logbackConfig}}
    {{ . }}{{ end }}
  {{- end }}
