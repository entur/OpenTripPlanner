{{- if .Values.journeyPlanner.enabled }}
apiVersion: v1
data:
  debug-ui-config.json: |+
   {
      "vectorTilesBasePath": "{{ required "debugUi.vectorTilesBaseUrl must be set, it is the Apigee URL of the debug vector tiles" .Values.debugUi.vectorTilesBaseUrl }}"
   }
kind: ConfigMap
metadata:
  name: otp2-debug-ui-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | indent 4 }}
  annotations:
    {{- include "common.annotations" . | indent 4 }}
{{- end }}
