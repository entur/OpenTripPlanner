otpFeatures:
  costlyAssertions: true
  emission: true
  empiricalDelay: true
journeyPlanner:
  enabled: false

# Deployed via GitHub CD, which only sets image.identifier - clear the Harness placeholder so
# configVersion falls back to the tag embedded in image.identifier (see app.configVersion helper).
build:
  number: ""
cronjobRedeployGraphBuilder:
    enabled: true
    mardukBucket: marduk-dev
    mardukInternalBucket: ror-marduk-internal-dev
    ignoreFareFrame: false
vehicleRentalGeofencing:
  url: "https://api.dev.entur.io/mobility/v2/gbfs/v3/manifest.json"

# Build zones for every system in the manifest that publishes them; systems that do not
# are skipped after their gbfs.json feed list is checked. Only the exceptions to the
# business-area default are listed.
gbfs:
  defaults:
    applyGeofencingZones: graph-build
    requireDropOffInsideBusinessArea: false
  networks:
  - network: boltoslo
    requireDropOffInsideBusinessArea: true
  - network: boltlillestrom
    requireDropOffInsideBusinessArea: true
  - network: boltsarpsborg
    requireDropOffInsideBusinessArea: true
  - network: rydeporsgrunn
    requireDropOffInsideBusinessArea: true
  - network: rydesarpsborg
    requireDropOffInsideBusinessArea: true
  - network: dottmalvik
    requireDropOffInsideBusinessArea: true
  - network: dottmelhus
    requireDropOffInsideBusinessArea: true
  - network: dottorkanger
    requireDropOffInsideBusinessArea: true
  - network: dottskaun
    requireDropOffInsideBusinessArea: true
  - network: dottstjordal
    requireDropOffInsideBusinessArea: true
  - network: dotttrondheim
    requireDropOffInsideBusinessArea: true
  - network: altairtrondheim
    requireDropOffInsideBusinessArea: true
