name: "D - Deploy otp2 graph builder release candidate 🚀"
run-name: "Deploy otp2 graph builder release candidate 🚀"
on:
  workflow_run:
    workflows: ["B - Build and push docker image 🎁"]
    types: [completed]
jobs:
  helm-lint:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Helm lint against every env values file
        run: |
          for env in dev tst prd jp-dev jp-tst jp-prd dev-jp-nordic dev-rc tst-rc prd-rc; do
            helm lint helm/otp2 -f helm/otp2/env/values-kub-ent-${env}.yaml
          done

  deploy-otp2-graph-builder-rc-dev:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [helm-lint]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west1
      gcp_cluster_name: kub-ent-dev-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-dev-rc.yaml
      namespace: marduk
      release_name: otp2-gb-rc
    secrets: inherit

  approval-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-otp2-graph-builder-rc-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  deploy-otp2-graph-builder-rc-tst:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [approval-tst]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west1
      gcp_cluster_name: kub-ent-tst-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-tst-rc.yaml
      namespace: marduk
      release_name: otp2-gb-rc
    secrets: inherit

  approval-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-otp2-graph-builder-rc-tst
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  deploy-otp2-graph-builder-rc-prd:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [approval-prd]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west1
      gcp_cluster_name: kub-ent-prd-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-prd-rc.yaml
      namespace: marduk
      release_name: otp2-gb-rc
    secrets: inherit
