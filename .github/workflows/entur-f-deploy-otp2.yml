name: "F - Deploy otp2 🚀"
run-name: "Deploy otp2 ${{ github.event.workflow_run.head_branch }} 🚀"
on:
  workflow_run:
    workflows: ["B - Build and push docker image 🎁"]
    types: [completed]
jobs:
  helm-lint:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Helm lint against every env values file
        run: |
          for env in dev tst prd jp-dev jp-tst jp-prd dev-jp-nordic dev-rc tst-rc prd-rc; do
            helm lint helm/otp2 -f helm/otp2/env/values-kub-ent-${env}.yaml
          done
  deploy-otp2-gb-dev:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [ helm-lint ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west1
      gcp_cluster_name: kub-ent-dev-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-dev.yaml
      namespace: marduk
      release_name: otp2-gb
    secrets: inherit

  deploy-otp2-dev-jp:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [helm-lint]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west4
      gcp_cluster_name: kub-ent-jp-dev-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-jp-dev.yaml
      namespace: otp2
      release_name: otp2
    secrets: inherit

  approval-tst:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-otp2-dev-jp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"

  deploy-otp2-gb-tst:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [ approval-tst ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west1
      gcp_cluster_name: kub-ent-tst-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-tst.yaml
      namespace: marduk
      release_name: otp2-gb
    secrets: inherit

  deploy-otp2-tst-jp:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [ approval-tst ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west4
      gcp_cluster_name: kub-ent-jp-tst-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-jp-tst.yaml
      namespace: otp2
      release_name: otp2
    secrets: inherit

  approval-prd:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: deploy-otp2-tst-jp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"

  deploy-otp2-gb-prd:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [ approval-prd ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west1
      gcp_cluster_name: kub-ent-prd-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-prd.yaml
      namespace: marduk
      release_name: otp2-gb
    secrets: inherit

  deploy-otp2-prd-jp:
    if: github.event.workflow_run.conclusion == 'success' && github.repository_owner == 'entur'
    needs: [ approval-prd ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: otp2:${{ github.event.workflow_run.head_branch }}
      gcp_cluster_location: europe-west4
      gcp_cluster_name: kub-ent-jp-prd-001
      chart: helm/otp2
      image_set_path: "image.identifier"
      values: values-kub-ent-jp-prd.yaml
      namespace: otp2
      release_name: otp2
    secrets: inherit