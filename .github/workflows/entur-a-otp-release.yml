name: "A - Release new OTP version 🛠️"
run-name: "Release new OTP version 🛠️"
on:
  schedule:
    - cron: '33 0 * * 1-5'
  workflow_dispatch:
    branches:
      - main
    inputs:
      log_level:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
      bump_ser_ver_id:
        description: 'Force bumping the ser.ver.id'
        default: false
        type: boolean
      hotfix:
        description: '🌶️ Hotfix! Specify the "as is" branch to release. No changes applied.'
        default: false
        type: boolean
  workflow_call:
    inputs:
      log_level:
        type: string
        default: 'info'
    outputs:
      version:
        description: 'The OTP version'
        value: ${{ jobs.release.outputs.version }}
      ser_ver_id:
        description: 'The OTP serialization id'
        value: ${{ jobs.release.outputs.ser_ver_id }}

permissions:
  contents: read

env:
  # The GitHub users allowed to decide that an upstream pull request goes into an Entur release, by
  # putting the "Entur Test" label on it. Anyone with triage rights on
  # opentripplanner/OpenTripPlanner can set that label, so this list - not the label itself - is what
  # the release trusts. Adding someone requires a reviewed pull request to the main_config branch.
  ENTUR_TEST_LABELERS: 'vpaturet t2gran testower sigtot'

jobs:
  # Verify who decided that the labeled pull requests go into this release. The release script merges
  # the current head of every open upstream pull request carrying the "Entur Test" label, so the
  # label is what lets third-party code into the Entur build. This job deliberately holds no
  # credentials, and it runs before the release job, which is the one with something worth stealing.
  verify-labeled-prs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify who labeled the pull requests included in this release
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX: ${{ inputs.hotfix }}
          UPSTREAM: opentripplanner/OpenTripPlanner
          # Keep in sync with 'include_prs_label' in script/custom-release-env.json
          LABEL: 'Entur Test'
        run: |
          set -euo pipefail

          # A hotfix releases a branch as it is, without merging any pull request.
          if [ "${HOTFIX}" = "true" ]; then
            echo "Hotfix release - no pull requests are merged, nothing to verify."
            exit 0
          fi

          PRS=$(gh api graphql -f label="${LABEL}" -f query='
            query($label: String!) {
              repository(owner: "opentripplanner", name: "OpenTripPlanner") {
                pullRequests(first: 100, states: OPEN, labels: [$label]) {
                  nodes { number headRefOid authorAssociation author { login } }
                }
              }
            }' --jq '.data.repository.pullRequests.nodes')

          {
            echo "### Pull requests included in this release"
            echo ""
            echo "| PR | Author | Labeled by | Head |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          UNTRUSTED=""
          for NUMBER in $(echo "$PRS" | jq -r '.[].number'); do
            PR=$(echo "$PRS" | jq -c --argjson n "$NUMBER" '.[] | select(.number == $n)')
            AUTHOR=$(echo "$PR" | jq -r '.author.login')
            ASSOCIATION=$(echo "$PR" | jq -r '.authorAssociation')
            HEAD=$(echo "$PR" | jq -r '.headRefOid[0:8]')

            # The label can be removed and set again, so only the last event is in force.
            # '--paginate' runs '--jq' once per page, which for a timeline longer than one page
            # yields one line per page and a blank line for every page without a labeling event.
            # '--slurp' collects the pages into a single document, which the filter then flattens,
            # so LABELER is one login whatever the length of the timeline. '--slurp' cannot be
            # combined with '--jq', hence the pipe.
            LABELER=$(gh api "repos/${UPSTREAM}/issues/${NUMBER}/timeline" --paginate --slurp \
              | jq -r "[.[][] | select(.event == \"labeled\" and (.label.name | ascii_downcase == \"${LABEL,,}\"))] | last | .actor.login")
            if [ -z "${LABELER}" ] || [ "${LABELER}" = "null" ]; then
              LABELER='unknown'
            fi

            echo "| [#${NUMBER}](https://github.com/${UPSTREAM}/pull/${NUMBER}) | ${AUTHOR} | ${LABELER} | ${HEAD} |" >> "$GITHUB_STEP_SUMMARY"

            # Compare against each entry in full. A pattern or substring match would accept a
            # login that is not on the list.
            TRUSTED=false
            for ALLOWED in ${ENTUR_TEST_LABELERS}; do
              if [ "${ALLOWED}" = "${LABELER}" ]; then
                TRUSTED=true
              fi
            done
            if [ "${TRUSTED}" != "true" ]; then
              UNTRUSTED="${UNTRUSTED}  - #${NUMBER} was labeled by '${LABELER}', who is not in ENTUR_TEST_LABELERS\n"
            fi

            # The label says the code was trusted when it was set, but the head of a pull request can
            # move afterwards. For an author outside the upstream organisation that gap is worth
            # looking at; it is not a reason to stop the release, since the labeler above is the
            # decision that counts.
            case "${ASSOCIATION}" in
              MEMBER | OWNER | COLLABORATOR) ;;
              *) echo "::warning::#${NUMBER} is authored by ${AUTHOR} (${ASSOCIATION}), outside the upstream organisation. Its head may have moved since it was labeled." ;;
            esac
          done

          if [ -n "${UNTRUSTED}" ]; then
            printf "::error::Untrusted labels:\n%b" "${UNTRUSTED}"
            echo "Remove the label, or add the person to ENTUR_TEST_LABELERS in this workflow."
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    # This condition ensures the job only runs if the branch is 'main'
    if: github.ref == 'refs/heads/main'
    needs: [verify-labeled-prs]
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      ser_ver_id: ${{ steps.set_ser_ver_id.outputs.ser_ver_id }}
    steps:
      # No token here. The release script only ever fetches from GitHub and both repositories are
      # public, so it does not need one. Without 'persist-credentials: false' the checkout leaves a
      # credential in .git/config for the steps that merge, build and test upstream pull requests.
      - name: Checkout entur/OpenTripPlanner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: temurin
      - name: Cache Maven dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
      # This step merges upstream pull requests and runs Maven over the result, so everything it
      # executes is third-party code. It therefore runs without any credential: the push the script
      # makes at the end goes to a throwaway repository on the runner, and the real push happens in
      # "Publish release" once Maven is done. Only the push URL is redirected, so the fetches the
      # script makes still reach GitHub.
      - name: Release OTP
        env:
          CUSTOM_RELEASE_GIT_HUB_API_TOKEN: ${{ github.token }}
          CUSTOM_RELEASE_LOG_LEVEL: ${{ inputs.log_level }}
        run: |
          echo "Start otp release script"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote rename origin entur
          git remote add otp https://github.com/opentripplanner/OpenTripPlanner.git
          git fetch --no-tags otp
          # The staging repository shares this checkout's objects and starts at the current
          # release, so the push the script makes at the end stays the small incremental push it
          # was against GitHub. Pushing into an empty repository would send the whole history
          # instead, which takes longer than the 20 s timeout custom-release.py puts on every git
          # command.
          git init --bare --quiet "${RUNNER_TEMP}/release-staging.git"
          printf '%s\n' "$(git rev-parse --path-format=absolute --git-path objects)" \
            > "${RUNNER_TEMP}/release-staging.git/objects/info/alternates"
          git --git-dir="${RUNNER_TEMP}/release-staging.git" \
            update-ref refs/heads/main "$(git rev-parse HEAD)"
          git config remote.entur.pushurl "${RUNNER_TEMP}/release-staging.git"
          git remote -v
          if [ "${{inputs.bump_ser_ver_id}}" == "true" ]; then
            SER_VER="--serVerId"
          fi
          if [ "${{inputs.hotfix}}" == "true" ]; then
            script/custom-release.py --summary --release $SER_VER
          else
            script/custom-release.py --summary $SER_VER otp/dev-2.x
          fi
      - name: Set version (Git repository Tag)
        id: set_version
        run: |
          VERSION_GIT_TAG=$(git describe --exact-match HEAD)
          echo "Set 'version=${VERSION_GIT_TAG}'"
          echo "version=${VERSION_GIT_TAG}" >> $GITHUB_OUTPUT
      - name: Set serialization version ID
        id: set_ser_ver_id
        run: |
          SER_VER_ID=$(mvn help:evaluate -Dexpression=otp.serialization.version.id -q -DforceStdout)
          echo "Set ser_ver_id=${SER_VER_ID}"
          echo "ser_ver_id=${SER_VER_ID}" >> $GITHUB_OUTPUT
      - name: Create Summary
        run: cat .custom_release_summary.md >> $GITHUB_STEP_SUMMARY
      # The first step that sees the token, and the last step to run. The authorization header keeps
      # the token out of the process arguments, where anything else on the runner could read it.
      - name: Publish release
        env:
          TOKEN: ${{ secrets.ENTUR_OTP_CI_BUILD }}
          GH_TOKEN: ${{ secrets.ENTUR_OTP_CI_BUILD }}
          TAG_NAME: ${{ steps.set_version.outputs.version }}
          SER_VER_ID: ${{ steps.set_ser_ver_id.outputs.ser_ver_id }}
        run: |
          set -euo pipefail
          trap 'git config --local --unset "http.https://github.com/.extraheader" || true' EXIT
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git push --force https://github.com/entur/OpenTripPlanner.git HEAD:main "refs/tags/${TAG_NAME}"
          echo "Release pushed to: entur/main"
          gh release create "${TAG_NAME}" \
            --title "Release ${TAG_NAME} (${SER_VER_ID})" \
            --notes-file .custom_release_summary.md
